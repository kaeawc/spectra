[package]
name = "spectra-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Diagnosis-first JVM desktop app for Spectra, built with Rune"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083", features = ["tooling"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Rune's vendored forks; Cargo doesn't inherit patches from a dependency. Keep every rev equal
# to the rune rev above.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "dbb35f507e15e0279b87cd90027b3fa70cb33083" }
