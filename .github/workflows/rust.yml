name: Rust

# The Rust port (docs/design/rust-port.md). Runs beside the Go CI until the cutover wave, then
# replaces it. Conventions from rust-build (one job per signal, rust-cache saved only from main,
# debuginfo-free `ci` profile, `--locked`, prebuilt tools, superseded runs cancelled) and from
# simee (change scoping, one macOS job per run, a cached macOS toolchain, one summary check).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds from a restored cache, never from incremental state: skip writing it.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  # Toolchain comes from rust-toolchain.toml.
  RUSTUP_MAX_RETRIES: 10

jobs:
  # What a pull request can reach (scripts/rust-ci-scope.sh): a Go-only, docs-only or
  # other-workflow change skips every Rust job, so it takes no macOS runner. Pushes to main and
  # manual runs run everything. Scoping fails safe: if the script fails, every job runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      desktop: ${{ steps.scope.outputs.desktop }}
    steps:
      # A pull request's checkout is its merge commit; its first parent is the base branch. A
      # rename lists both paths (--no-renames), so moving a file the workspace reads counts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scope() { git diff --no-renames --name-only HEAD^1 HEAD | bash scripts/rust-ci-scope.sh; }
          else
            scope() { bash scripts/rust-ci-scope.sh --all; }
          fi
          if ! scope > scope.txt; then
            echo "::warning::rust-ci-scope.sh failed: running every job"
            printf 'rust=true\ndesktop=true\n' > scope.txt
          fi
          cat scope.txt
          cat scope.txt >> "$GITHUB_OUTPUT"

  # Formatting needs no compilation and no cache: the fastest signal.
  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - run: cargo fmt --all --check

  # The desktop is its own workspace (it fetches Rune), so cargo fmt can't run there without a
  # fetch; rustfmt over its sources needs none. desktop/rustfmt.toml keeps it on rustfmt's
  # defaults instead of the root width of 140. Runs for any change that can reach the desktop.
  fmt-desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - run: find desktop/src -name '*.rs' -print0 | xargs -0 rustfmt --check --edition 2024

  # Dependency policy (deny.toml): one version per crate, no aws-lc/OpenSSL, RustSec advisories,
  # licenses, sources. Reads Cargo.lock only — no compilation. Replaces go-licenses and gosec.
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Lint and test on each OS in one job each: collectors have macOS-only and Linux-only code
  # paths, and one job per OS restores one cache and takes one runner (macOS runners are the
  # scarce ones). Clippy runs first: it fails fast and its metadata is reused by the build.
  lint-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint-test-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets --all-features --profile ci -- -D warnings
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --cargo-profile ci --profile ci --hide-progress-bar --no-tests=warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # Parity layer 2 (docs/design/rust-port.md): builds the Go and Rust binaries and compares the
  # shape of their JSON on a live host, per OS (the interface list differs by OS): every key
  # path, JSON type and null-versus-absent, never values. The recorded contract cases pin bytes;
  # this checks what a fresh Go build prints today.
  shape-diff:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build -o spectra-go ./cmd/spectra
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: shape-diff-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --profile ci -p kaeawc-spectra -p spectra-contract
      - run: target/ci/spectra-shape-diff ./spectra-go target/ci/spectra -- capabilities --json
      - run: target/ci/spectra-shape-diff ./spectra-go target/ci/spectra -- memory --json

  # The desktop app (desktop/, its own workspace and lockfile) on macOS, its real target:
  # clippy then tests, from desktop/'s own cache. Runs only when a change can reach the desktop
  # (desktop/, crates/, Cargo.lock, rust-toolchain.toml).
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop-macos
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The window and its view tests also build on Linux (the macOS-only parts compile to stubs),
  # so a Linux-only break shows without a Mac. libxkbcommon-dev is what linking the tests needs;
  # Wayland, X11 and fontconfig load at run time, so no other packages.
  desktop-linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image's package index is usually fresh enough; refresh only when the install fails.
      - run: sudo apt-get install -y --no-install-recommends libxkbcommon-dev || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev)
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # One check that sums up the run, for the merge loop: green when every job passed or was
  # skipped because the change can't reach Rust, red when any failed or was cancelled (a failed
  # `changes` fails it too, though the jobs after it show as skipped).
  rust-ok:
    if: always()
    needs: [changes, fmt, fmt-desktop, deny, lint-test, shape-diff, package, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case $r in success | skipped) ;; *) exit 1 ;; esac
          done

  # Packages every crate as crates.io would receive it (no upload, no token), so packaging
  # breaks show up on the PR that causes them rather than on release day.
  package:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: package
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The repo keeps `publish = false` until the owner confirms crate names and the first
      # version, and cargo won't resolve one unpublishable workspace crate from another. So this
      # job lifts that guard in its own throwaway checkout only; spectra-contract (test-only,
      # never published) stays out.
      - name: Allow packaging in this checkout only
        run: sed -i 's/^publish = false$/publish = ["crates-io"]/' Cargo.toml
      - run: cargo package --workspace --locked --allow-dirty --exclude spectra-contract
