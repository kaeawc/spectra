name: research-measure (temporary)

on:
  push:
    branches: ['work/push-data-sources-research']

permissions:
  contents: read

jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Host
        run: sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; csrutil status || true; ps -A | wc -l
      - name: Build
        run: |
          go build -o spectra ./cmd/spectra/
          (cd scripts/research/procpush && go build -o ../../../procpush .)
      - name: Probe (non-root)
        run: ./procpush
      - name: Cost under CPU load at background priority
        run: |
          for _ in $(seq 10); do yes >/dev/null & done
          sleep 2
          echo "--- normal priority, loaded"; ./procpush -cost-only
          echo "--- taskpolicy -b (background, like ProcessType Background), loaded"; taskpolicy -b ./procpush -cost-only
          pkill yes || true
      - name: eslogger volume
        run: |
          sudo eslogger exec fork exit >es.jsonl 2>es.err &
          sleep 8
          echo "idle window start $(wc -l <es.jsonl)"; sleep 30; echo "idle window end $(wc -l <es.jsonl)"
          n0=$(wc -l <es.jsonl)
          for _ in $(seq 200); do /usr/bin/true; done
          sleep 3
          n1=$(wc -l <es.jsonl)
          echo "workload events (200 x /usr/bin/true) $((n1-n0))"
          sudo pkill -INT eslogger || true
          sleep 1
          cat es.err
          echo "total events=$(wc -l <es.jsonl) bytes=$(wc -c <es.jsonl)"
          python3 -c "import json,collections,sys; c=collections.Counter(json.loads(l)['event_type'] for l in open('es.jsonl')); print('by event_type (9=exec 11=fork 32=exit):', dict(c))"
