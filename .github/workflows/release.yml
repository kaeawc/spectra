name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Select and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version must be vX.Y.Z or vX.Y.Z-<pre>" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODESIGN_ID: ${{ secrets.CODESIGN_ID }}
        run: VERSION="$VERSION" bash scripts/dist.sh
      - name: Check stamped version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tar -xzf "dist/spectra_${VERSION}_darwin_arm64.tar.gz" -C "$tmp"
          got="$("$tmp/spectra_${VERSION}_darwin_arm64/bin/spectra" version)"
          if [[ "$got" != "$VERSION" ]]; then
            echo "spectra version printed '$got', expected '$VERSION'" >&2
            exit 1
          fi
      # The formula lives outside dist/ so the signed manifest covers exactly
      # the archives; publish attaches it as a separate release asset.
      - name: Render Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p formula
          bash scripts/release-formula.sh "$VERSION" dist formula/spectra.rb
          ruby -c formula/spectra.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-unsigned
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: formula/spectra.rb
          if-no-files-found: error

  sign:
    # The signing key exists only in the protected "release" environment, and
    # only tag pushes reach this job; manual dispatches stop at unsigned builds.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      # This job holds the signing key: actions are pinned to commits, the
      # checkout credential is not persisted, and no shared cache is restored.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-unsigned
          path: dist
      - name: Create and verify signed release manifest
        env:
          SPECTRA_RELEASE_ED25519_KEY: ${{ secrets.SPECTRA_RELEASE_ED25519_KEY }}
          VERSION: ${{ github.ref_name }}
        run: bash scripts/release-manifest.sh "$VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: formula
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=("$TAG" dist/spectra_*.tar.gz dist/checksums.txt dist/spectra-release.json dist/spectra-release.json.sig formula/spectra.rb --verify-tag --title "Spectra $TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
