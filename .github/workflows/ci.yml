name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_call:

permissions:
  checks: write
  contents: read

jobs:
  # macos-latest is required: detection shells out to plutil, otool,
  # codesign, file, and sqlite3 — all macOS-only utilities.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o spectra ./cmd/spectra/

      - name: go test (with junit)
        run: |
          gotestsum --junitfile junit-report.xml --format standard-verbose -- -count=1 -race ./...

      - name: Check if test reports were created
        id: junit-reports-exist
        uses: andstor/file-existence-action@v3
        with:
          files: junit-report.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: steps.junit-reports-exist.outputs.files_exists == 'true'
        with:
          report_paths: junit-report.xml

      - name: Smoke test against system apps
        run: |
          ./spectra /System/Applications/Calculator.app
          ./spectra --json /System/Applications/Chess.app | python3 -m json.tool

  # Runs the darwin/amd64 cross-compile (the macOS "build"; there is no
  # Xcode project, so no xcodebuild) and the test suite as Mach-O binaries
  # under Darling (https://darlinghq.org) on a Linux runner, via
  # scripts/darling-ci.sh with the CI-only shims in ci/ (plutil, sqlite3,
  # Security.framework stub — never part of macOS builds).
  #
  # ALWAYS SKIPPED for now: Darling emulates macOS 11.7, while Go 1.24+
  # binaries target macOS 12, so the run needs a Security.framework symbol
  # stub and still hits Darling runtime bugs (sigtramp crashes under
  # subprocess load, os/exec and TLS hangs) — last full run: 67/74 test
  # packages passed, spectra CLI worked. When Darling can present macOS 12,
  # delete the `if: false` below to re-enable; everything else is wired.
  #
  # The pinned release debs target Ubuntu 24.04 (noble) amd64; keep the
  # runner pinned to match. Darling is userspace-only (darlingserver), so
  # no kernel module is needed on hosted runners. zig cross-links the
  # Security stub dylib.
  darling-smoke:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Experimental job: results land in the step summary and logs, but a
    # failure never blocks the PR.
    continue-on-error: true
    env:
      DARLING_DEBS_URL: https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip
      DARLING_DEBS_SHA256: 27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd
      ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Darling
        run: |
          curl -fsSL --retry 3 -o /tmp/darling-debs.zip "$DARLING_DEBS_URL"
          echo "$DARLING_DEBS_SHA256  /tmp/darling-debs.zip" | sha256sum -c -
          unzip -q /tmp/darling-debs.zip -d /tmp/darling-debs
          sudo apt-get update
          # Minimal CLI dependency closure; the full `darling` metapackage
          # drags in GUI, Python 2, Ruby, and Perl components we don't need.
          sudo apt-get install -y \
            /tmp/darling-debs/debs_*/darling-core_*.deb \
            /tmp/darling-debs/debs_*/darling-system_*.deb \
            /tmp/darling-debs/debs_*/darling-cli-gui-common_*.deb \
            /tmp/darling-debs/debs_*/darling-cli-python2-common_*.deb \
            /tmp/darling-debs/debs_*/darling-cli_*.deb

      - name: Install zig (cross-links the Security stub dylib)
        run: |
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz "$ZIG_URL"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Build and test under Darling
        run: ./scripts/darling-ci.sh

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gocyclo
        run: go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - name: Run gocyclo
        run: gocyclo -over 15 -ignore '_test\.go$' .

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run

  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest
      - name: Run go-licenses
        run: go-licenses report ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          # Excluded rules:
          #   G104 — best-effort cleanup of os.Remove etc. is intentional
          #   G204 — invoking fixed macOS utilities is the inspection model
          #   G304 — Detect, scanStorage take filesystem paths as input by design
          #   G602 — false positive on byte conversion of UintN(256)
          #   G703 — same path-as-input rationale as G304
          #   G704 — URL is caller input by design
          gosec -exclude-generated -exclude=G104,G204,G304,G602,G703,G704 -fmt=junit-xml -out=gosec-report.xml -stdout ./...

      - name: Check if security report was created
        id: gosec-report-exists
        uses: andstor/file-existence-action@v3
        with:
          files: gosec-report.xml

      - name: Publish Security Report
        uses: mikepenz/action-junit-report@v6
        if: steps.gosec-report-exists.outputs.files_exists == 'true'
        with:
          report_paths: gosec-report.xml

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate workflows + shell scripts
        run: ./scripts/validate-workflows.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # validate_lychee.sh consults git history for renamed files

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Install lychee
        run: ./scripts/lychee/install_lychee.sh

      - name: Validate mkdocs nav
        run: ./scripts/validate_mkdocs_nav.sh

      - name: Validate links (lychee)
        run: ./scripts/lychee/validate_lychee.sh

      - name: MkDocs build (strict)
        run: mkdocs build --strict
