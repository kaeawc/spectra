name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_call:

permissions:
  checks: write
  contents: read

jobs:
  # macos-latest is required: detection shells out to plutil, otool,
  # codesign, file, and sqlite3 — all macOS-only utilities.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download

      - name: Install gotestsum
        run: ./scripts/retry.sh go install gotest.tools/gotestsum@latest

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o spectra ./cmd/spectra/

      - name: go test (with junit)
        run: |
          gotestsum --junitfile junit-report.xml --format standard-verbose -- -count=1 -race ./...

      - name: Check if test reports were created
        id: junit-reports-exist
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: junit-report.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: steps.junit-reports-exist.outputs.files_exists == 'true'
        with:
          report_paths: junit-report.xml

      - name: Smoke test against system apps
        run: |
          ./spectra /System/Applications/Calculator.app
          ./spectra --json /System/Applications/Chess.app | python3 -m json.tool

  # Native Linux build + test. Spectra targets macOS first but is host-OS-
  # aware; this lane runs the suite for the Linux-backend collector packages
  # (CGO off, matching the static Linux binary) and smoke-tests the OS-aware
  # commands against real /proc and /sys. The detect engine and its consumers
  # shell out to macOS-only tools (plutil/otool/codesign) in their tests and
  # are macOS-only by design; vet+build still cover them for Linux compilation.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build -o spectra ./cmd/spectra/
      - name: go test (Linux backends)
        run: |
          go test -count=1 \
            ./internal/hostos/... \
            ./internal/process/... \
            ./internal/metrics/... \
            ./internal/storagestate/... \
            ./internal/netstate/... \
            ./internal/sysinfo/... \
            ./internal/toolchain/... \
            ./internal/helper/... \
            ./cmd/spectra/ \
            ./internal/detect/ \
            ./internal/netdiag/ \
            ./internal/snapshot/
      - name: Smoke test OS-aware commands
        run: |
          set -x
          ./spectra process | head -5
          ./spectra storage | head -5
          ./spectra snapshot > /dev/null
          if ./spectra inspect /nonexistent.app 2>&1 | grep -qi 'unsupported'; then
            echo "app inspection correctly refused on Linux"
          else
            echo "expected inspect to report unsupported on Linux"; exit 1
          fi

  # Runs the Linux-backend tests and OS-aware smoke commands on more than
  # Ubuntu: glibc distros with different tool builds (Debian, Fedora) and
  # Alpine (musl, busybox base, no systemd). The binaries are static
  # (CGO off), so they are built once on the host runner and executed inside
  # each distro container with its own real ip/ss/ps/df; no distro needs Go.
  # The script also runs locally against Docker.
  #
  # Each matrix entry is a required check on main by its full name, e.g.
  # `linux-distros (ubuntu:24.04)`: changing an image here renames the check,
  # so update the green-main ruleset in the same change (see
  # docs/development/testing.md). The timeout bounds a stalled distro package
  # mirror (median ~2m; the Ubuntu archive has trickled for ~18m).
  linux-distros:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12', 'fedora:41', 'alpine:3.20']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download
      - name: Build static spectra + test binaries
        run: ./scripts/linux-distro-ci.sh build "$RUNNER_TEMP/linux-dist"
      - name: Pull ${{ matrix.image }}
        run: ./scripts/retry.sh docker pull -q "${{ matrix.image }}"
      - name: Test and smoke inside ${{ matrix.image }}
        run: ./scripts/linux-distro-ci.sh container "${{ matrix.image }}" "$RUNNER_TEMP/linux-dist"

  # End-to-end systemd install paths on a real VM: the per-user daemon as a
  # systemd --user unit (spectra daemon install/status/uninstall) and the
  # privileged helper as a system unit (spectra install-helper, --status,
  # install-helper uninstall). Hosted runners have passwordless sudo, which
  # the helper installer's sudo calls rely on.
  linux-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download
      - name: Build spectra and spectra-helper side by side
        run: |
          # install-helper looks for spectra-helper next to its own executable.
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/spectra" ./cmd/spectra/
          go build -o "$RUNNER_TEMP/bin/spectra-helper" ./cmd/spectra-helper/
          echo "SPECTRA=$RUNNER_TEMP/bin/spectra" >> "$GITHUB_ENV"
      - name: Start a systemd user manager
        run: |
          # The runner is not a logind session, so no user manager exists;
          # lingering starts user@UID.service and its session bus.
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 30); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 1
          done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      - name: Per-user daemon via systemd --user
        run: |
          set -euxo pipefail
          unit="$HOME/.config/systemd/user/spectra-daemon.service"
          systemctl --user is-system-running || true
          "$SPECTRA" daemon install
          test -f "$unit"
          systemctl --user is-enabled spectra-daemon.service
          for _ in $(seq 1 30); do
            "$SPECTRA" daemon status && break
            sleep 1
          done
          systemctl --user is-active spectra-daemon.service
          # The daemon answering must be the unit's process, not a spawn.
          main_pid=$(systemctl --user show -p MainPID --value spectra-daemon.service)
          "$SPECTRA" daemon status --json | jq -e --argjson pid "$main_pid" '.pid == $pid'
          # A daemon-backed command over the socket.
          "$SPECTRA" alerts --state all --json | jq -e 'type == "array"'
          "$SPECTRA" daemon uninstall
          test ! -e "$unit"
          if systemctl --user is-active --quiet spectra-daemon.service; then
            echo "daemon unit still active after uninstall"; exit 1
          fi
          if "$SPECTRA" daemon status; then
            echo "daemon still answering after uninstall"; exit 1
          fi
      - name: Privileged helper via systemd system unit
        run: |
          set -euxo pipefail
          unit=/etc/systemd/system/spectra-helper.service
          helper=/usr/local/lib/spectra/spectra-helper
          sock=/var/run/spectra-helper.sock
          "$SPECTRA" install-helper
          test -f "$unit"
          test -x "$helper"
          systemctl is-enabled spectra-helper.service
          for _ in $(seq 1 30); do
            [ -S "$sock" ] && break
            sleep 1
          done
          systemctl is-active spectra-helper.service
          test "$(stat -c '%U:%G %a' "$sock")" = "root:spectra 660"
          # install-helper added $USER to the spectra group, but this shell
          # predates that; sg picks the new membership up without a re-login.
          sg spectra -c "$SPECTRA install-helper --status"
          "$SPECTRA" install-helper uninstall
          test ! -e "$unit"
          test ! -e "$helper"
          if systemctl is-active --quiet spectra-helper.service; then
            echo "helper unit still active after uninstall"; exit 1
          fi
      - name: Service logs on failure
        if: failure()
        run: |
          systemctl --user status spectra-daemon.service --no-pager || true
          journalctl --user -u spectra-daemon.service --no-pager -n 100 || true
          "$SPECTRA" daemon logs -n 100 || true
          sudo systemctl status spectra-helper.service --no-pager || true
          sudo journalctl -u spectra-helper.service --no-pager -n 100 || true

  # Spectra as a cloud agent VM runs it: static Linux binaries on amd64 and
  # arm64, spectra-mcp spawned over stdio the way an agent host's .mcp.json
  # does, and the CLI commands agent harnesses (waaagh) script. The installer
  # check runs in an ubuntu:22.04 container: that image matches common VM
  # bases and ships OpenSSL 3.0, which the signature check must work with,
  # without depending on the retiring ubuntu-22.04 runner labels.
  mcp-stdio-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-24.04', 'ubuntu-24.04-arm']
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download
      - name: Build spectra and spectra-mcp
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/spectra" ./cmd/spectra/
          go build -o "$RUNNER_TEMP/bin/spectra-mcp" ./cmd/spectra-mcp/
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: stdio MCP end-to-end (initialize, tools/list, tools/call, EOF)
        run: SPECTRA_MCP_BIN="$RUNNER_TEMP/bin/spectra-mcp" go test ./cmd/spectra-mcp/ -run TestStdioEndToEnd -count=1 -v
      - name: mcpcheck tool schemas (live)
        run: |
          go run github.com/kaeawc/mcpcheck/cmd/mcpcheck@71ff641145e02636996a75890ed0691cffa05462 \
            --live "$RUNNER_TEMP/bin/spectra-mcp"
      - name: Agent CLI contract
        run: |
          set -euxo pipefail
          root=$(mktemp -d)
          spectra version
          spectra capabilities --json | jq -e '.os == "linux" and ([.interfaces[].name] | index("load") and index("orphans") and index("owner"))'
          # load exits 0 admit, 3 hold, 4 backoff; the JSON is the contract.
          rc=0; spectra load --json --top 3 --root "$root" > load.json || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 3 ] || [ "$rc" = 4 ]
          jq -e '(.load1 | type) == "number" and .cpus >= 1 and (.devices | type) == "object"' load.json
          # verdict exits: orphans/idle 3 = some found; owner 3 = none, 4 = none
          # but some processes unreadable (other users' on a non-root runner).
          verdict() { want=$1; shift; rc=0; "$@" > out.json || rc=$?; case " 0 $want " in *" $rc "*) ;; *) echo "exit $rc"; return 1 ;; esac; }
          verdict 3 spectra orphans --json --root "$root" && jq -e '.groups | type == "array"' out.json
          verdict "3 4" spectra owner --under --json "$root" && jq -e '.holders | type == "array"' out.json
          verdict 3 spectra idle --json --pids "$$" --min-age 1s && jq -e '.result.holders | type == "array"' out.json
          spectra lineage --json "$$" | jq -e '.pid > 0'
          spectra process --json | jq -e 'length > 0'
      - name: Install the pinned release with signature verification (ubuntu:22.04, OpenSSL 3.0)
        run: |
          ./scripts/retry.sh docker pull -q ubuntu:22.04
          docker run --rm -v "$PWD/scripts:/scripts:ro" ubuntu:22.04 bash -euo pipefail -c '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates openssl >/dev/null
            openssl version
            sh /scripts/install.sh --version v0.1.1 --prefix /opt/spectra 2>&1 | tee /tmp/install.log
            grep -q "Verified Ed25519 release signature" /tmp/install.log
            /opt/spectra/bin/spectra-mcp --version'

  # Runs the darwin/amd64 cross-compile (the macOS "build"; there is no
  # Xcode project, so no xcodebuild) and the test suite as Mach-O binaries
  # under Darling (https://darlinghq.org) on a Linux runner, via
  # scripts/darling-ci.sh with the CI-only shims in ci/ (plutil, sqlite3,
  # Security.framework stub — never part of macOS builds).
  #
  # ALWAYS SKIPPED for now: Darling emulates macOS 11.7, while Go 1.24+
  # binaries target macOS 12, so the run needs a Security.framework symbol
  # stub and still hits Darling runtime bugs (sigtramp crashes under
  # subprocess load, os/exec and TLS hangs) — last full run: 67/74 test
  # packages passed, spectra CLI worked. When Darling can present macOS 12,
  # delete the `if: false` below to re-enable; everything else is wired.
  #
  # The pinned release debs target Ubuntu 24.04 (noble) amd64; keep the
  # runner pinned to match. Darling is userspace-only (darlingserver), so
  # no kernel module is needed on hosted runners. zig cross-links the
  # Security stub dylib.
  darling-smoke:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Experimental job: results land in the step summary and logs, but a
    # failure never blocks the PR.
    continue-on-error: true
    env:
      DARLING_DEBS_URL: https://github.com/darlinghq/darling/releases/download/v0.1.20260608/debs_20260608.zip
      DARLING_DEBS_SHA256: 27469ef3932da2e91dd7fb34b70e3628a3e54b7af9fb5480051f44af35eca1fd
      ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Darling
        run: |
          curl -fsSL --retry 3 -o /tmp/darling-debs.zip "$DARLING_DEBS_URL"
          echo "$DARLING_DEBS_SHA256  /tmp/darling-debs.zip" | sha256sum -c -
          unzip -q /tmp/darling-debs.zip -d /tmp/darling-debs
          sudo apt-get update
          # Minimal CLI dependency closure; the full `darling` metapackage
          # drags in GUI, Python 2, Ruby, and Perl components we don't need.
          sudo apt-get install -y \
            /tmp/darling-debs/debs_*/darling-core_*.deb \
            /tmp/darling-debs/debs_*/darling-system_*.deb \
            /tmp/darling-debs/debs_*/darling-cli-gui-common_*.deb \
            /tmp/darling-debs/debs_*/darling-cli-python2-common_*.deb \
            /tmp/darling-debs/debs_*/darling-cli_*.deb

      - name: Install zig (cross-links the Security stub dylib)
        run: |
          curl -fsSL --retry 3 -o /tmp/zig.tar.xz "$ZIG_URL"
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"

      - name: Build and test under Darling
        run: ./scripts/darling-ci.sh

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install gocyclo
        run: ./scripts/retry.sh go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - name: Run gocyclo
        run: gocyclo -over 15 -ignore '_test\.go$' .

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download
      - name: Install golangci-lint v2
        run: ./scripts/retry.sh go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run

  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download
      - name: Install go-licenses
        run: ./scripts/retry.sh go install github.com/google/go-licenses@latest
      - name: Run go-licenses
        run: go-licenses report ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules
        run: ./scripts/retry.sh go mod download

      - name: Install gosec
        run: ./scripts/retry.sh go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: |
          # Excluded rules:
          #   G104 — best-effort cleanup of os.Remove etc. is intentional
          #   G204 — invoking fixed macOS utilities is the inspection model
          #   G304 — Detect, scanStorage take filesystem paths as input by design
          #   G602 — false positive on byte conversion of UintN(256)
          #   G703 — same path-as-input rationale as G304
          #   G704 — URL is caller input by design
          gosec -exclude-generated -exclude=G104,G204,G304,G602,G703,G704 -fmt=junit-xml -out=gosec-report.xml -stdout ./...

      - name: Check if security report was created
        id: gosec-report-exists
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: gosec-report.xml

      - name: Publish Security Report
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: steps.gosec-report-exists.outputs.files_exists == 'true'
        with:
          report_paths: gosec-report.xml

  codeql-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: go
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Test the workflow validator
        run: ./scripts/test-validate-workflows.sh
      - name: Test the Hive setup script
        run: ./scripts/test-hive-setup.sh
      - name: Test the helper VM script
        run: ./scripts/test-helper-vm-test.sh
      - name: Test the Rust CI scope script
        run: ./scripts/test-rust-ci-scope.sh
      - name: Validate workflows + shell scripts
        run: ./scripts/validate-workflows.sh

  core-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check core remote boundary
        run: bash scripts/check_no_remote.sh

  # Runs on Buildkite instead while CI_ON_BUILDKITE is true (see the buildkite job).
  docs:
    if: ${{ !(vars.CI_ON_BUILDKITE == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # validate_lychee.sh consults git history for renamed files

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Install lychee
        run: ./scripts/lychee/install_lychee.sh

      - name: Validate mkdocs nav
        run: ./scripts/validate_mkdocs_nav.sh

      - name: Validate links (lychee)
        run: ./scripts/lychee/validate_lychee.sh

      - name: MkDocs build (strict)
        run: mkdocs build --strict

  # Starts the Buildkite build (.buildkite/pipeline.yml) for this commit while the repository
  # variable CI_ON_BUILDKITE is true: same-repo pull requests and pushes to main. Fork PRs, other
  # pushes and workflow_call runs keep the GitHub `docs` job. Switch with scripts/ci-backend.sh,
  # which also repoints the required `docs` check.
  buildkite:
    if: ${{ vars.CI_ON_BUILDKITE == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Create the Buildkite build
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          BUILDKITE_ORG: ${{ vars.BUILDKITE_ORG }}
          BUILDKITE_PIPELINE: ${{ vars.BUILDKITE_PIPELINE }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n --arg commit "$COMMIT" --arg branch "$BRANCH" --arg message "$MESSAGE" \
            --arg pr "$PR_NUMBER" --arg base "$PR_BASE" \
            '{commit: $commit, branch: $branch, message: $message}
             + (if $pr != "" then {pull_request_id: ($pr | tonumber), pull_request_base_branch: $base} else {} end)' \
            > build.json
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $BUILDKITE_API_TOKEN" -H "Content-Type: application/json" \
            --data @build.json \
            "https://api.buildkite.com/v2/organizations/$BUILDKITE_ORG/pipelines/$BUILDKITE_PIPELINE/builds" \
            | jq -r '"Buildkite build: " + .web_url'
