# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
  # GitHub Actions — keeps all `uses:` pins current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # Go modules
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, go]
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # Rust crates (docs/design/rust-port.md). deny.toml fails a bump that duplicates a crate, so
  # hold such bumps with an `ignore` here until the framework that shares the crate moves.
  - package-ecosystem: cargo
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, rust]
    groups:
      rust-minor-patch:
        update-types: [minor, patch]

  # Buildkite step images (.buildkite/images/*/Dockerfile), pinned by digest
  - package-ecosystem: docker
    directories:
      - /.buildkite/images/*
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      buildkite-images:
        patterns: ["*"]
